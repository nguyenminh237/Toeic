spring:
  datasource:
    url: jdbc:h2:mem:toeic-tests;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
app:
  media:
    storage-path: ${java.io.tmpdir}/toeic-private-media-tests
  maintenance:
    enabled: false
  admin:
    enabled: false
jwt:
  signer-key: test-only-signing-key-with-more-than-sixty-four-ascii-characters-for-hs512-2026
